name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:3001"
      ALLOWED_ORIGIN: "http://localhost:3000"
      SKIP_ENV_VALIDATION: true # If you use t3-env or similar

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run Tests
      run: npx jest --maxWorkers=2
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"

    # Prisma generate is needed before build/typecheck
    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Type Check
      run: npx tsc --noEmit

    - name: Build
      run: npm run build
