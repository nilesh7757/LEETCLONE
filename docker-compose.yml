services:
  web:
    build: .
    user: root
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - next-cache:/app/.next
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password123@db:5432/logiquest?schema=public}
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3001
      - NODE_ENV=development
    command: npm run dev
    depends_on:
      - db
      - socket
      - redis
    restart: always

  socket:
    build: .
    user: root
    command: npm run socket
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password123@db:5432/logiquest?schema=public}
      - REDIS_URL=redis://redis:6379
      - PORT=3001
    depends_on:
      - db
      - redis
    restart: always

  worker:
    build: .
    user: root
    command: npm run worker
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password123@db:5432/logiquest?schema=public}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: logiquest
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
  next-cache:
